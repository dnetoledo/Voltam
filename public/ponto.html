<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VoltMap">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Ponto de recarga – VoltMap</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- TelaDetalhesPonto (RF05 – Detalhes do ponto de recarga) -->
  <header class="topo">
    <a class="voltar" href="index.html" aria-label="Voltar ao mapa">←</a>
    <a class="marca" href="index.html"><span class="raio">⚡</span>VoltMap</a>
    <div class="topo-acoes" id="topo-acoes"></div>
  </header>
  <div class="capa" aria-hidden="true">⚡</div>
  <main class="detalhes">
    <div class="aviso" id="aviso" role="alert"></div>
    <div class="cartao oculto" id="cartao">
      <div class="cabecalho-ponto">
        <div>
          <h1 id="nome"></h1>
          <p class="endereco" id="endereco" style="margin:4px 0 0;color:var(--suave)"></p>
        </div>
        <div class="acoes-ponto">
          <div id="status"></div>
          <button class="favorito" id="favorito" type="button" aria-pressed="false" title="Adicionar aos favoritos">☆</button>
        </div>
      </div>
      <p class="atualizacao" id="atualizacao"></p>
      <div class="numeros">
        <div><strong id="conectores"></strong><span>Conector</span></div>
        <div><strong id="potencia"></strong><span>Potência</span></div>
        <div><strong id="vagas"></strong><span>Vagas</span></div>
      </div>
      <div class="info">
        <div><span class="rot">Horário de funcionamento</span><span id="horario"></span></div>
        <div><span class="rot">Cadastrado em</span><span id="data"></span></div>
      </div>
      <div id="mini-mapa"></div>
      <a class="btn btn-secundario btn-bloco" id="rota" target="_blank" rel="noopener">Como chegar</a>
    </div>

    <!-- Recarga ativa -->
    <section class="cartao secao oculto" id="secao-recarga">
      <h2>Recarga</h2>
      <div id="recarga-conteudo"></div>
    </section>

    <!-- UC04 – Fazer check-in (protótipo da Figura 3) -->
    <section class="cartao secao oculto" id="secao-checkin">
      <h2>Fazer check-in</h2>
      <p class="dica">Informe como está o ponto agora. O status fica visível para outros motoristas por 2 horas.</p>
      <div id="checkin-login" class="oculto"><a class="btn btn-secundario btn-bloco" id="link-login-checkin">Entre para fazer check-in</a></div>
      <form id="form-checkin" class="oculto">
        <div class="opcoes-status" role="radiogroup" aria-label="Status do ponto">
          <button type="button" class="opcao-status" data-status="DISPONIVEL" aria-checked="false" role="radio"><span>✓</span>Disponível</button>
          <button type="button" class="opcao-status" data-status="OCUPADO" aria-checked="false" role="radio"><span>◷</span>Ocupado</button>
          <button type="button" class="opcao-status" data-status="FORA_DE_SERVICO" aria-checked="false" role="radio"><span>⊗</span>Fora de serviço</button>
        </div>
        <div class="campo">
          <label for="comentario">Comentário (opcional)</label>
          <input id="comentario" maxlength="280" placeholder="Ex.: Carregador funcionando bem, fácil de estacionar.">
        </div>
        <div class="aviso" id="aviso-checkin" role="alert"></div>
        <button class="btn btn-primario btn-bloco" type="submit" id="confirmar-checkin">Confirmar Check-in</button>
      </form>
    </section>

    <section class="cartao secao oculto" id="secao-historico">
      <h2>Check-ins recentes</h2>
      <ul class="historico" id="historico"></ul>
    </section>
  </main>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ponto.js"></script>
</body>
</html>
