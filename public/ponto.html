<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VoltMap">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Ponto de recarga – VoltMap</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- TelaDetalhesPonto (RF05 – Detalhes do ponto de recarga) -->
  <header class="topo">
    <a class="voltar" href="index.html" aria-label="Voltar ao mapa">←</a>
    <a class="marca" href="index.html"><span class="raio">⚡</span>VoltMap</a>
    <div class="topo-acoes" id="topo-acoes"></div>
  </header>
  <div class="capa" aria-hidden="true">⚡</div>
  <main class="detalhes">
    <div class="aviso" id="aviso" role="alert"></div>
    <div class="cartao oculto" id="cartao">
      <div class="cabecalho-ponto">
        <div>
          <h1 id="nome"></h1>
          <p class="endereco" id="endereco" style="margin:4px 0 0;color:var(--suave)"></p>
        </div>
        <div id="status"></div>
      </div>
      <div class="numeros">
        <div><strong id="conectores"></strong><span>Conector</span></div>
        <div><strong id="potencia"></strong><span>Potência</span></div>
        <div><strong id="vagas"></strong><span>Vagas</span></div>
      </div>
      <div class="info">
        <div><span class="rot">Horário de funcionamento</span><span id="horario"></span></div>
        <div><span class="rot">Cadastrado em</span><span id="data"></span></div>
      </div>
      <div id="mini-mapa"></div>
      <a class="btn btn-primario btn-bloco" id="rota" target="_blank" rel="noopener">Como chegar</a>
    </div>
  </main>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ponto.js"></script>
</body>
</html>
