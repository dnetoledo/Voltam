<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VoltMap">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Criar conta – VoltMap</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- TelaCadastroUsuario (RF01 – Criar conta) -->
  <header class="topo"><a class="marca" href="index.html"><span class="raio">⚡</span>VoltMap</a></header>
  <main class="pagina">
    <div class="cartao">
      <h1>Criar conta</h1>
      <p class="subtitulo">Cadastre-se para contribuir com o mapa de recarga.</p>
      <div class="aviso" id="aviso" role="alert"></div>
      <form id="form-cadastro" novalidate>
        <div class="campo">
          <label for="nome">Nome</label>
          <input id="nome" autocomplete="name" required>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div class="linha">
          <div class="campo">
            <label for="senha">Senha</label>
            <input id="senha" type="password" autocomplete="new-password" minlength="6" required>
          </div>
          <div class="campo">
            <label for="confirmacao">Confirmar senha</label>
            <input id="confirmacao" type="password" autocomplete="new-password" required>
          </div>
        </div>
        <button class="btn btn-primario btn-bloco" type="submit" id="enviar">Criar conta</button>
      </form>
      <p class="rodape-form">Já tem conta? <a id="link-login" href="login.html">Entrar</a></p>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
