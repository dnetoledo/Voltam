<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VoltMap">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Entrar – VoltMap</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- TelaLogin (UC01 – Autenticar-se) -->
  <header class="topo"><a class="marca" href="index.html"><span class="raio">⚡</span>VoltMap</a></header>
  <main class="pagina">
    <div class="cartao">
      <h1>Entrar</h1>
      <p class="subtitulo">Acesse para cadastrar pontos de recarga.</p>
      <div class="aviso" id="aviso" role="alert"></div>
      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primario btn-bloco" type="submit" id="enviar">Entrar</button>
      </form>
      <p class="rodape-form"><a href="ajuda.html">Como usar o VoltMap</a></p>
      <p class="rodape-form">Não tem uma conta? <a id="link-cadastro" href="cadastro.html">Cadastre-se</a></p>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
