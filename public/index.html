<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VoltMap">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>VoltMap – Pontos de recarga</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <!-- TelaMapa (UC02 – Buscar Pontos de Recarga Próximos) -->
  <header class="topo">
    <a class="marca" href="index.html"><span class="raio">⚡</span>VoltMap</a>
    <div class="topo-acoes" id="topo-acoes"></div>
  </header>

  <div class="tela-mapa">
    <div class="barra-busca">
      <form class="busca" id="form-busca">
        <input id="endereco" type="search" placeholder="Buscar endereço ou bairro" aria-label="Endereço" autocomplete="off">
        <button class="btn btn-primario icone-btn" type="submit" aria-label="Buscar">🔍</button>
        <button class="btn btn-secundario icone-btn" type="button" id="btn-local" aria-label="Minha localização" title="Minha localização">📍</button>
        <button class="btn btn-secundario icone-btn" type="button" id="btn-filtros" aria-label="Filtros" aria-expanded="false" title="Filtros">⚙︎</button>
      </form>

      <div class="filtros" id="filtros">
        <div class="grupo">
          <span class="rotulo">Tipo de conector</span>
          <div class="chips" id="filtro-conectores"></div>
        </div>
        <div class="grupo">
          <span class="rotulo">Disponibilidade</span>
          <div class="chips" id="filtro-status"></div>
        </div>
        <div class="linha">
          <div>
            <span class="rotulo">Potência mínima</span>
            <select id="filtro-potencia">
              <option value="">Qualquer</option>
              <option value="7">7 kW ou mais</option>
              <option value="22">22 kW ou mais</option>
              <option value="50">50 kW ou mais (rápido)</option>
              <option value="100">100 kW ou mais</option>
            </select>
          </div>
          <div>
            <span class="rotulo">Raio de busca</span>
            <select id="filtro-raio">
              <option value="5">5 km</option>
              <option value="10" selected>10 km</option>
              <option value="25">25 km</option>
              <option value="50">50 km</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="instalar" id="instalar" hidden role="status">
      <span class="instalar-icone" aria-hidden="true"><img src="/icons/icon-192.png" alt=""></span>
      <span class="instalar-texto"></span>
      <button class="btn btn-primario instalar-botao" type="button" hidden>Instalar</button>
      <button class="instalar-fechar" type="button" aria-label="Fechar">✕</button>
    </div>

    <div class="conteudo-mapa">
      <div class="mapa-wrap">
        <div id="mapa" role="region" aria-label="Mapa de pontos de recarga"></div>
        <button class="btn buscar-area" id="buscar-area" type="button">↻ Buscar nesta área</button>
      </div>
      <section class="resultados" aria-live="polite">
        <div class="aviso" id="aviso"></div>
        <p class="resumo" id="resumo">Obtendo sua localização…</p>
        <ul class="lista" id="lista"></ul>
      </section>
    </div>
  </div>

  <a class="btn btn-primario fab" href="novo-ponto.html">＋ Adicionar ponto</a>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mapa.js"></script>
</body>
</html>
